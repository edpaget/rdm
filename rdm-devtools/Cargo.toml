[package]
name = "rdm-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Repository-only developer tooling for rdm (bounded process runner and workflow test binding); not published or distributed"
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "rdm-smoke"
path = "src/bin/rdm-smoke.rs"

[[bin]]
name = "rdm-devtools-fixture"
path = "src/bin/rdm-devtools-fixture.rs"

[dependencies]
clap = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
tempfile = { workspace = true }
