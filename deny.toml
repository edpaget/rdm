[licenses]
confidence-threshold = 0.8

allow = [
    # Permissive licenses (always GPLv3-compatible)
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",

    # Copyleft licenses compatible with GPLv3
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-3.0",
    "MPL-2.0",
]

[advisories]
# TEMPORARY — the entry is removed by the `replace-unmaintained-deps` roadmap
# (plan repo), which replaces the dependency instead of ignoring the notice.
# It is an "unmaintained" notice with no upgrade available at the time of
# writing; it is not a vulnerability.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: via serde_yaml in rdm-core; removed when rdm-core moves to serde-saphyr" },
]
