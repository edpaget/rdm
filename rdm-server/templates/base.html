<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rdm{% endblock %}</title>
  <script>
    // Apply theme before render to prevent flash of wrong theme
    (function() {
      var saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <script src="/static/edit.js" defer></script>
  <script src="/static/review-highlight.js" defer></script>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <header>
      <a href="/" class="site-title" aria-label="rdm home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="160" height="64" role="img" aria-label="rdm">
          <defs>
            <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&amp;display=swap');</style>
            <clipPath id="text-clip">
              <text x="200" y="97" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="110" text-anchor="middle" letter-spacing="8">RDM</text>
            </clipPath>
          </defs>
          <g clip-path="url(#text-clip)">
            <rect x="0" y="20" width="400" height="10.4" fill="#4A90D9"/>
            <rect x="0" y="33.9" width="400" height="10.4" fill="#4A90D9"/>
            <rect x="0" y="47.8" width="400" height="10.4" fill="#4A90D9"/>
            <rect x="0" y="61.7" width="400" height="10.4" fill="#4A90D9"/>
            <rect x="0" y="75.6" width="400" height="10.4" fill="#4A90D9"/>
            <rect x="0" y="89.5" width="400" height="10.4" fill="#4A90D9"/>
          </g>
        </svg>
      </a>
      <div class="header-actions">
        {% block header_search %}{% endblock %}
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      </div>
    </header>
    <div class="breadcrumb-row">
      <nav aria-label="Breadcrumb">
        <ol>
          {% block breadcrumb %}{% endblock %}
        </ol>
      </nav>
      <div class="quick-filters-slot">{% block quick_filters %}{% endblock %}</div>
    </div>
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
    <footer>
      Powered by <a href="https://github.com/edpaget/rdm">rdm</a>
    </footer>
  </div>
  <script>
    (function() {
      var btn = document.getElementById("theme-toggle");
      function updateIcon() {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        btn.textContent = isDark ? "\u2600\uFE0F" : "\uD83C\uDF19";
      }
      updateIcon();
      btn.addEventListener("click", function() {
        var current = document.documentElement.getAttribute("data-theme");
        var next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        updateIcon();
      });
    })();
  </script>
</body>
</html>
