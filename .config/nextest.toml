[test-groups.server-integration]
max-threads = 4

[[profile.default.overrides]]
filter = "package(rdm-server) & kind(test)"
test-group = "server-integration"

# rdm-devtools lifecycle tests spawn real process groups; a teardown regression
# must fail the run rather than hang it.
[[profile.default.overrides]]
filter = "package(rdm-devtools)"
slow-timeout = { period = "20s", terminate-after = 3 }

# The workflow component tests drive a Node child per test through
# rdm_devtools::workflow; a hung host must fail the run rather than hang it.
[[profile.default.overrides]]
filter = "package(rdm-cli) & (binary(workflow_review) | binary(workflow_passes) | binary(distribution))"
slow-timeout = { period = "30s", terminate-after = 4 }
