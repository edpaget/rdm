# The pinned SlopCodeBench (SCBench) configuration `rdm-measure scbench run`
# drives. Every value a result depends on lives here; the runner builds the
# `slop-code` run and agent configs from it and from nothing else.
# See README.md. COST WARNING: a run without --dry-run is a paid run.

[scbench]
repo = "https://github.com/SprocketLab/slop-code-bench"
sha = "af5a9cbc311605b5cceb80200ca9832bdff2d7b1"

[problems]
repo = "https://github.com/gabeorlanski/scb-problems"
sha = "9cd9ca3a51c3d3e2a99d2488a25baf73a2204451"
# Upstream's configs/runs/lite_under20.yaml ("strict under-$20 subset"); each
# problem has several checkpoints.
subset = ["mvvault", "xjq"]

[agent]
provider = "claude_code_oauth"
model = "opus-5.5"
model_file = "models/opus-5.5.yaml"   # relative to this manifest
thinking = "xhigh"
claude_code_version = "2.1.322"
pass_policy = "all-cases"
environment = "docker-python3.12-uv"
step_limit = 100
cost_limit = 0
net_cost_limit = 0

# The arms are the ablation ladder (ladder.md), run in ladder order: the
# upstream controls first, then the rdm rungs. `group` tags each arm as an rdm
# treatment or a control; the report compares by it.

[[arm]]
name = "just-solve"
group = "control"
prompt = "configs/prompts/just-solve.jinja"   # relative to the SCBench checkout

[[arm]]
name = "anti_slop"
group = "control"
prompt = "configs/prompts/anti_slop.jinja"

[[arm]]
name = "plan_first"
group = "control"
prompt = "configs/prompts/plan_first.jinja"

[[arm]]
name = "plan-and-test"
group = "control"
prompt = "configs/prompts/plan-and-test.jinja"

# Every rdm rung's limits override [agent]'s for that arm only: the rdm
# commands (and planned's whole plan-only pass) run in the main session, so it
# needs far more than 100 turns; cost never truncates it (0 is unlimited), and
# 1000 is a finite backstop against a runaway loop.

# tracked (ladder.md): one phase per checkpoint, implemented directly on main
# and marked done; no plan, review or land stage.
[[arm]]
name = "tracked"
group = "rdm"
prompt = "prompts/tracked.jinja"   # relative to this manifest
prompt_from = "manifest"
image = "rdm"
step_limit = 1000
cost_limit = 0
net_cost_limit = 0

# planned (ladder.md): rdm:dispatch-phase --plan-only plans and plan-reviews
# each phase; the agent implements the approved plan directly on main.
[[arm]]
name = "planned"
group = "rdm"
prompt = "prompts/planned.jinja"
prompt_from = "manifest"
image = "rdm"
step_limit = 1000
cost_limit = 0
net_cost_limit = 0

# The full rdm lane (README.md § "Full-lane arm"): one roadmap per problem,
# one phase per checkpoint, driven by rdm:dispatch-phase and landed by
# rdm:land.
[[arm]]
name = "full-lane"
group = "rdm"
prompt = "prompts/full-lane.jinja"   # relative to this manifest
prompt_from = "manifest"
image = "rdm"
step_limit = 1000
cost_limit = 0
net_cost_limit = 0

# The rdm-equipped agent image (README.md § "rdm-equipped image"). An arm runs
# in it with `image = "rdm"`; `scbench image build|check` read this table.
# plan_root is the plan repo inside the agent container: it must lie outside
# the environment's graded directory (docker.workdir, /workspace), so plan-repo
# files never count toward the metrics.
[rdm]
plan_root = "/rdm-plan"
project = "bench"
