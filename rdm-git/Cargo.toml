[package]
name = "rdm-git"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Repo-agnostic git primitives for rdm: run-at-a-path helpers, HEAD/branch/reachability inspection, and project-repo worktree lifecycle"

[dependencies]
rdm-core = { path = "../rdm-core" }
gix = { version = "0.85", default-features = false, features = ["basic", "index", "revision", "parallel", "sha1"] }

[dev-dependencies]
rdm-store-fs = { path = "../rdm-store-fs" }
tempfile = { workspace = true }
