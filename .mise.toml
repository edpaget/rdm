[tools]
rust = "1.94"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-dist" = "latest"
hk = "1.45"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
# Node executes production JS for Rust-owned Codex tests and the workflow
# component tests (rdm_devtools::workflow, driven by `cargo nextest run`).
# Ordinary binary-only CLI use does not require it; the optional Codex runtime does.
node = "24"

[env]
RUSTFLAGS = "-D warnings"
RDM_ROOT = "{{env.HOME}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "rdm"
# Dogfood-only compensating control for `rdmBin` defaulting to a plain `rdm` on
# PATH: inside this repo that default would be a stale global build, which the
# development-build rule forbids. Skills resolve $RDM_BIN before invoking a
# workflow. No harness gates this variable: the one that did
# (scripts/verify-workflow-dispatch.sh § 9c-dogfood) was retired with the
# rdm-wf-dispatch-phase engine in agent-orchestrated-dispatch phase 7.
RDM_BIN = "{{config_root}}/target/debug/rdm"
