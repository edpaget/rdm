[tools]
rust = "1.94"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-dist" = "latest"
hk = "1.45"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
# node hosts the dogfood-only workflow-review harness (scripts/verify-workflow-review.sh).
# Dev/CI toolchain only — never a runtime or crate dependency, not shipped in the binary.
node = "24"

[env]
RUSTFLAGS = "-D warnings"
RDM_ROOT = "{{env.HOME}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "rdm"
# Dogfood-only compensating control for `rdmBin` defaulting to a plain `rdm` on
# PATH: inside this repo that default would be a stale global build, which the
# development-build rule forbids. Skills resolve $RDM_BIN before invoking a
# workflow. Gated by scripts/verify-workflow-dispatch.sh § 9c-dogfood.
RDM_BIN = "{{config_root}}/target/debug/rdm"
