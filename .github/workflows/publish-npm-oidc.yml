# Reusable workflow invoked by the dist-generated release.yml as a
# custom publish job (configured via `publish-jobs = ["./publish-npm-oidc"]`
# in dist-workspace.toml). Publishes the cargo-dist-generated npm tarball
# using npm trusted publishing (OIDC) so we don't need a long-lived
# NPM_TOKEN secret. Requires that a Trusted Publisher is configured on
# npmjs.com for the @edpaget/rdm package, pointing at this repo and the
# top-level `release.yml` workflow.
name: Publish npm package (OIDC)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-npm-oidc:
    runs-on: ubuntu-22.04
    # Trusted publishing exchanges this OIDC token with npmjs.com for a
    # short-lived publish credential. The caller (release.yml) also grants
    # this permission at the job level; both must agree.
    permissions:
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          # Node 24 ships an npm new enough for trusted publishing
          # (>= 11.5.1). Avoid Node 22 — the 22.22.2 toolcache image has
          # a broken bundled npm (missing `promise-retry`) that crashes
          # `npm install -g npm@latest`. See nodejs/node#62425.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest
      # Each cargo-dist-generated tarball is extracted, patched with the
      # `mcpName` field required by the MCP Registry verification flow,
      # and republished from the extracted directory. The `mcpName` value
      # must match `name` in server.json (io.github.edpaget/rdm).
      - name: Publish npm packages
        run: |
          mkdir -p extracted
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            dir="extracted/${pkg%.tar.gz}"
            mkdir -p "$dir"
            tar -xzf "./npm/${pkg}" -C "$dir" --strip-components=1
            (cd "$dir" && npm pkg set mcpName=io.github.edpaget/rdm)
            npm publish --access public --provenance "$dir"
          done
