name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 shallow clone: the shell
          # harnesses read bodies out of git history. verify-agent-config-
          # distribution.sh § 5j recovers the pre-removal superseded workflow
          # templates from the parent of the commit that deleted each path,
          # which resolves to nothing in a shallow clone.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Shell lint (shellcheck)
        run: mise exec shellcheck -- shellcheck $(git ls-files '*.sh')

      - name: Shell format check (shfmt)
        run: mise exec shfmt -- shfmt -d $(git ls-files '*.sh')

      - name: Test
        run: cargo nextest run

      - name: Shell harnesses
        run: |
          cargo build
          for f in scripts/verify-*.sh; do
            echo "== $f"
            bash "$f"
          done

      - name: Build (release)
        run: cargo build --release

      - name: Audit dependencies
        run: cargo deny check
