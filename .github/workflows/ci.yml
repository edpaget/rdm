name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 shallow clone: the shell
          # harnesses read bodies out of git history. verify-agent-config-
          # distribution.sh § 5j recovers the pre-removal superseded workflow
          # templates from the parent of the commit that deleted each path,
          # which resolves to nothing in a shallow clone.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Shell lint (shellcheck)
        run: mise exec shellcheck -- shellcheck $(git ls-files '*.sh')

      - name: Shell format check (shfmt)
        run: mise exec shfmt -- shfmt -d $(git ls-files '*.sh')

      - name: Feature-matrix check (optional features off)
        # `git` and `server` are optional features of rdm-cli, so a build with
        # either disabled is a configuration the crate claims to support. The
        # steps above only ever exercise the default feature set, which is how
        # an unguarded `rdm_git::` call or a `#[cfg(feature = "git")]` helper
        # invoked from a feature-agnostic call site reaches `main` unnoticed.
        run: |
          cargo check -p rdm-cli --no-default-features
          cargo check -p rdm-cli --no-default-features --features server
          cargo check -p rdm-cli --no-default-features --features git
          cargo check -p rdm-server --no-default-features

      - name: Test
        run: cargo nextest run

      - name: Shell harnesses
        run: |
          cargo build
          for f in scripts/verify-*.sh; do
            echo "== $f"
            bash "$f"
          done

      - name: Build (release)
        run: cargo build --release

      - name: Codex execution and runtime contracts (no credentials)
        run: mise exec node -- node --test --test-concurrency=1 scripts/lib/codex-spike-*.test.mjs scripts/lib/codex-runtime*.test.mjs

      - name: Audit dependencies
        run: cargo deny check
