name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Shell lint (shellcheck)
        run: mise exec shellcheck -- shellcheck $(git ls-files '*.sh')

      - name: Shell format check (shfmt)
        run: mise exec shfmt -- shfmt -d $(git ls-files '*.sh')

      - name: Feature-matrix check (optional features off)
        # `git` and `server` are optional features of rdm-cli, so a build with
        # either disabled is a configuration the crate claims to support. The
        # steps above only ever exercise the default feature set, which is how
        # an unguarded `rdm_git::` call or a `#[cfg(feature = "git")]` helper
        # invoked from a feature-agnostic call site reaches `main` unnoticed.
        run: |
          cargo check -p rdm-cli --no-default-features
          cargo check -p rdm-cli --no-default-features --features server
          cargo check -p rdm-cli --no-default-features --features git
          cargo check -p rdm-server --no-default-features

      - name: Test
        # Rust owns Codex fixtures/assertions; Node only executes production JS.
        run: mise exec node -- cargo nextest run

      - name: Doctests
        # nextest does not run doctests.
        run: cargo test --doc --workspace

      - name: Suite hygiene (nested whole-suite runs)
        # The rdm-cli/tests/suite_hygiene/ tests, which the default profile
        # skips: temp-dir worktree leaks, a hostile git config, the hook-env
        # canary, and their mutation controls. Node: the nested runs include
        # the workflow tests.
        run: mise exec node -- cargo nextest run --profile suite-hygiene

      - name: Build (release)
        run: cargo build --release

      - name: Audit dependencies
        run: cargo deny check

  emacs:
    name: Emacs package suite (${{ matrix.emacs }})
    runs-on: ubuntu-latest
    # The snapshot row tracks Emacs master and may break for reasons
    # outside this repo; only the 31.1 row gates a merge.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs: "31.1"
            experimental: false
          - emacs: snapshot
            experimental: true
    env:
      # A missing `emacs` or init directory fails the suite instead of
      # skipping it.
      RDM_EMACS_REQUIRED: "1"
      RDM_EMACS_INIT_DIR: ${{ github.workspace }}/.emacs-init

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install Emacs ${{ matrix.emacs }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Cache the soft-dependency init directory
        uses: actions/cache@v6
        with:
          path: .emacs-init
          key: emacs-init-${{ matrix.emacs }}-${{ hashFiles('editors/emacs/test/ci-init/init.el') }}

      - name: Provide evil, magit, consult and embark
        run: |
          mkdir -p "$RDM_EMACS_INIT_DIR"
          cp editors/emacs/test/ci-init/init.el "$RDM_EMACS_INIT_DIR/init.el"
          emacs --batch --init-directory "$RDM_EMACS_INIT_DIR" -l "$RDM_EMACS_INIT_DIR/init.el"

      - name: Emacs suite (bare and soft-dependency passes)
        run: cargo nextest run -p rdm-cli --test emacs_package
